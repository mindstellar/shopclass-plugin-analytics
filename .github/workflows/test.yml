# Runs the unit tests on PHP 8.0 and 8.3 and the JavaScript test on Node. Core is checked out so a
# later integration test can use it; SHOPCLASS_CORE_REF picks the core branch.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tests
        run: ./tests/run.sh
